packages:
  - 'client'
  - 'server'
ignoreWorkspaceRootCheck: true
# NOTE: pnpm reads `overrides` here (or `pnpm.overrides` in package.json) —
# it does NOT honor the top-level `resolutions` field (that's Yarn).
overrides:
  # Regenerated 2026-09-18 from an audit with this block stripped and the lockfile
  # re-resolved, so every entry below is one that is demonstrably still holding
  # something back. Bounded ranges, never carets: a caret is satisfied by the
  # vulnerable version already pinned in the lockfile.
  baseline-browser-mapping: '>=2.11.0 <3.0.0'
  body-parser: '>=2.3.0 <3.0.0'
  cookie: '>=0.7.0 <1.0.0'
  fast-uri: '>=3.1.6 <4.0.0'
  js-yaml: '>=4.3.2 <5.0.0'
  qs: '>=6.16.0 <7.0.0'
  # brace-expansion is vulnerable across three majors with different fixes, and
  # 1.x/2.x consumers (commitlint and other older tooling) cannot cross a major.
  'brace-expansion@1': '>=1.1.18 <2.0.0'
  'brace-expansion@2': '>=2.1.4 <3.0.0'
  'brace-expansion@5': '>=5.0.9 <6.0.0'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
