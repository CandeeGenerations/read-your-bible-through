packages:
  - 'client'
  - 'server'
ignoreWorkspaceRootCheck: true
# NOTE: pnpm reads `overrides` here (or `pnpm.overrides` in package.json) —
# it does NOT honor the top-level `resolutions` field (that's Yarn).
overrides:
  # Regenerated 2026-09-18 from an audit with this block stripped and the lockfile
  # re-resolved. Only entries that still hold something back survive; bounded range,
  # never a caret, since a caret is satisfied by the vulnerable version already locked.
  cookie: '>=0.7.0 <1.0.0'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
