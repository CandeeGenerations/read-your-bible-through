# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    pull-request-branch-name:
      separator: '-' # Use hyphens to separate branch name segments
    schedule:
      interval: 'monthly'
    groups:
      minor-updates:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
    ignore:
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      # muted 2026-09-18 — @types/node tracks the Node major actually in use, which .nvmrc,
      # engines.node and the Dockerfile all pin to 24. Latest stays unreachable until Node 26
      # reaches Active LTS (~Oct 2026), so this otherwise reopens every month. Dashboard #86
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions' # Check for updates to GitHub Actions every week
    directory: '/'
    pull-request-branch-name:
      separator: '-'
    schedule:
      interval: 'monthly'
    groups:
      minor-updates:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
